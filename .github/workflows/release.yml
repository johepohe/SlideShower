name: Build and publish installers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 1.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        name: Validate version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $REQUESTED_VERSION" >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build Debian installer
        env:
          PYTHON_BIN: python
        run: packaging/build_linux_deb.sh "${{ needs.version.outputs.number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: installers/*.deb
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build Windows installer
        shell: powershell
        run: packaging\build_windows.ps1 -Version "${{ needs.version.outputs.number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installers/*.exe
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build macOS installer
        env:
          PYTHON_BIN: python
        run: packaging/build_macos.sh "${{ needs.version.outputs.number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: installers/*.dmg
          if-no-files-found: error

  release:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installer"
          path: installers
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" installers/* \
              --generate-notes \
              --title "SlideShower $TAG" \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi
